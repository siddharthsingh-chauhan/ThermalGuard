# Tests every push; builds the installer and publishes a GitHub release for
# every tag like v1.0.0 (the tag must match version.py).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Check tag matches version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path version.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != version.py $version" }

      - name: Build app
        run: pyinstaller --noconfirm --clean ThermalGuard.spec

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path version.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc /Qp "/DAppVersion=$version" installer\ThermalGuard.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: ThermalGuard-Setup
          path: dist/ThermalGuard-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ThermalGuard-Setup-*.exe
          generate_release_notes: true
